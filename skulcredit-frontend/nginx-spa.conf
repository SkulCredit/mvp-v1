# Lightweight nginx config for the SPA container.
# This is NOT the edge nginx — it only serves static files.
# The edge nginx (skulcredit_nginx) proxies /api/v1/* to the api container
# and everything else to this container.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long cache TTLs
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health check endpoint for Docker
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # React Router — all other paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
