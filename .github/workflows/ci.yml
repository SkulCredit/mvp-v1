name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: skulcredit-backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: skulcredit-backend

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: skulcredit-backend

      - name: Build
        run: npm run build
        working-directory: skulcredit-backend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: skulcredit-backend/dist
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skulcredit
          POSTGRES_PASSWORD: skulcredit_pass
          POSTGRES_DB: skulcredit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://skulcredit:skulcredit_pass@localhost:5432/skulcredit_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret
      JWT_EXPIRES_IN: 1h

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: skulcredit-backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: skulcredit-backend

      - name: Run tests
        run: npm test
        working-directory: skulcredit-backend

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push — smoke test)
        uses: docker/build-push-action@v5
        with:
          context: skulcredit-backend
          push: false
          target: prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: skulcredit-api:${{ github.sha }}
