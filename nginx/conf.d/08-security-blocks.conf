location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~ /(\.env|\.git|\.svn|\.htaccess|\.htpasswd|composer\.json|package\.json|yarn\.lock|\.dockerignore|Dockerfile) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~* \.(bak|backup|old|orig|save|swp|tmp|temp|log)$ {
    deny all;
    access_log /var/log/nginx/security_blocked.log security_log;
    return 404;
}

location ~* "(wp-admin|wp-login|phpmyadmin|phpMyAdmin|adminer|manager/html|solr/admin|jenkins|jmx-console)" {
    access_log /var/log/nginx/security_blocked.log security_log;
    return 404;
}

location ~* "(union\s+select|insert\s+into|delete\s+from|drop\s+table|update\s+.*set|exec\s*\(|execute\s*\()" {
    access_log /var/log/nginx/security_blocked.log security_log;
    add_header Content-Type application/json always;
    return 403 '{"error":"SQL injection attempt detected","code":"SQLI_BLOCKED","request_id":"$req_id"}';
}

location ~* "(<script|javascript:|onerror=|onload=|eval\(|base64_decode|phpinfo|shell_exec)" {
    access_log /var/log/nginx/security_blocked.log security_log;
    add_header Content-Type application/json always;
    return 403 '{"error":"XSS attempt detected","code":"XSS_BLOCKED","request_id":"$req_id"}';
}

location ~* "(\.\./|\.\.\\|etc/passwd|etc/shadow|windows/system)" {
    access_log /var/log/nginx/security_blocked.log security_log;
    add_header Content-Type application/json always;
    return 403 '{"error":"Path traversal attempt detected","code":"PATH_TRAVERSAL_BLOCKED","request_id":"$req_id"}';
}

location ~* "(wget\s+|curl\s+http|/bin/bash|/bin/sh|cmd\.exe|powershell\.exe)" {
    access_log /var/log/nginx/security_blocked.log security_log;
    add_header Content-Type application/json always;
    return 403 '{"error":"Command injection attempt detected","code":"CMD_INJECTION_BLOCKED","request_id":"$req_id"}';
}
