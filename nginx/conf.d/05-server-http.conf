server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /health {
        access_log off;
        return 200 '{"status":"healthy","service":"skulcredit-nginx"}';
        add_header Content-Type application/json always;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        access_log off;
        proxy_pass            http://skulcredit_api/metrics;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    location /api/v1/upload/ {
        if ($request_uri ~* "(\.\./|/etc/passwd|/proc/|\.git|\.env)") {
            return 403 '{"error":"Forbidden","code":"PATH_BLOCKED"}';
        }

        client_max_body_size 10m;

        proxy_pass            http://skulcredit_api;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID      $req_id;
        proxy_set_header      Cookie            $http_cookie;
        proxy_pass_header     Set-Cookie;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;

        error_page 502 503 504 = @api_unavailable;
    }

    location /api/v1/auth/ {
        if ($request_uri ~* "(\.\./|/etc/passwd|/proc/|\.git|\.env)") {
            return 403 '{"error":"Forbidden","code":"PATH_BLOCKED"}';
        }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        client_max_body_size 5m;

        proxy_pass            http://skulcredit_api;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID      $req_id;
        proxy_set_header      Cookie            $http_cookie;
        proxy_pass_header     Set-Cookie;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       off;

        error_page 502 503 504 = @api_unavailable;
    }

    location /api/v1/ {
        if ($request_uri ~* "(\.\./|/etc/passwd|/proc/|\.git|\.env)") {
            return 403 '{"error":"Forbidden","code":"PATH_BLOCKED"}';
        }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        client_max_body_size 2m;

        proxy_pass            http://skulcredit_api;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID      $req_id;
        proxy_set_header      Cookie            $http_cookie;
        proxy_pass_header     Set-Cookie;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       off;

        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        add_header Content-Type application/json always;
        return 503 '{"error":"Service temporarily unavailable","code":"SERVICE_UNAVAILABLE","request_id":"$req_id"}';
    }

    include /etc/nginx/conf.d/10-health-checks.conf;
    include /etc/nginx/conf.d/swagger-locations.conf;
    include /etc/nginx/conf.d/09-administrative-security.conf;
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|map)$ {
        proxy_pass          http://skulcredit_frontend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;

        expires             1y;
        add_header          Cache-Control "public, immutable";

        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    location / {
        proxy_pass          http://skulcredit_frontend;
        proxy_http_version  1.1;
        proxy_set_header    Connection        $http_connection;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        error_page 502 503 504 @frontend_unavailable;
    }

    location @frontend_unavailable {
        add_header Content-Type text/html always;
        return 503 '<html><body style="font-family:sans-serif;text-align:center;margin-top:10%"><h1>SkulCredit is starting up&hellip;</h1><p>Please refresh in a moment.</p></body></html>';
    }
    location @service_unavailable {
        add_header Content-Type application/json always;
        return 503 '{"error":"Service temporarily unavailable","code":"SERVICE_UNAVAILABLE","request_id":"$req_id"}';
    }
}
