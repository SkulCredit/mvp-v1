
location = /nginx-health {
    access_log off;
    return 200 '{"status":"healthy","service":"nginx"}';
    add_header Content-Type application/json always;
}

location = /backend-health {
    access_log off;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    proxy_pass             http://skulcredit_api/api/v1/health;
    proxy_http_version     1.1;
    proxy_set_header       Connection "";
    proxy_set_header       Host $host;
    proxy_connect_timeout  5s;
    proxy_read_timeout     5s;

    error_page 502 503 504 = @health_failed;
}

location @health_failed {
    default_type application/json;
    return 503 '{"status":"DOWN","message":"Service temporarily unavailable"}';
}

location = /internal/metrics {
    access_log off;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    proxy_pass            http://skulcredit_api/metrics;
    proxy_http_version    1.1;
    proxy_set_header      Connection "";
    proxy_set_header      Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout    10s;
}
