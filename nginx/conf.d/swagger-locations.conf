location = /swagger {
    return 301 /api/v1/docs/;
}

location = /docs {
    return 301 /api/v1/docs/;
}

# swagger-ui-express mounts the UI at /api/v1/docs and serves its own
# static assets (swagger-ui.css, swagger-ui-bundle.js, etc.) from the
# same prefix.  The ^~ modifier gives this block higher priority than
# any regex location (e.g. the \.css|\.js catch-all in 05-server-http),
# so ALL requests under /api/v1/docs reach the API container — not the
# frontend — regardless of file extension.
location ^~ /api/v1/docs {
    proxy_pass            http://skulcredit_api;
    proxy_http_version    1.1;
    proxy_set_header      Connection        "";
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_redirect        off;

    # Allow swagger-ui assets to be cached but still be validated
    add_header Cache-Control "public, max-age=3600";
    access_log off;
}

location = /api/v1/docs.json {
    proxy_pass            http://skulcredit_api/api/v1/docs.json;
    proxy_http_version    1.1;
    proxy_set_header      Connection        "";
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_redirect        off;
    access_log off;
}
