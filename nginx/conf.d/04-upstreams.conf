upstream skulcredit_api {
    server api:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream skulcredit_frontend {
    server frontend:80 max_fails=3 fail_timeout=30s;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}
