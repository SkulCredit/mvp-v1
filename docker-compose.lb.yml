# docker-compose.lb.yml — Load-balancer overlay
#
# Extends docker-compose.yml with horizontal API scaling 
# nginx image pinning. Apply it on every deploy:
#

services:
  api:
    image: ${API_IMAGE:-}
    deploy:
      replicas: ${API_REPLICAS:-2}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first 
      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: pause

  nginx:
    image: ${NGINX_IMAGE:-}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
  frontend:
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    deploy:
      replicas: 1
  redis:
    deploy:
      replicas: 1
  rabbitmq:
    deploy:
      replicas: 1
