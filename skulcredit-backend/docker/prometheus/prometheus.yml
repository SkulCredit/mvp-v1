global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: production
    project: skulcredit

# Alert rules
rule_files:
  - /etc/prometheus/alerts.yml

# ─────────────────────────────────────────────────────────────────────────────
# Scrape targets
# ─────────────────────────────────────────────────────────────────────────────
scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── SkulCredit Node.js API ─────────────────────────────────────────────────
  # Express app exposes prom-client metrics at GET /metrics (no auth required
  # within the Docker monitoring_net; nginx blocks public access to /metrics).
  - job_name: skulcredit_api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: skulcredit_api
          environment: production
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: skulcredit_api

  # ── Nginx ──────────────────────────────────────────────────────────────────
  # nginx-prometheus-exporter sidecar (add when needed).
  # Uncomment and deploy exporter container to enable.
  # - job_name: nginx
  #   static_configs:
  #     - targets: ["nginx-exporter:9113"]
  #       labels:
  #         service: skulcredit_nginx

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  # postgres_exporter sidecar — uncomment when deployed.
  # - job_name: postgres
  #   static_configs:
  #     - targets: ["postgres_exporter:9187"]
  #       labels:
  #         service: skulcredit_postgres

  # ── Redis ──────────────────────────────────────────────────────────────────
  # redis_exporter sidecar — uncomment when deployed.
  # - job_name: redis
  #   static_configs:
  #     - targets: ["redis_exporter:9121"]
  #       labels:
  #         service: skulcredit_redis

  # ── RabbitMQ built-in Prometheus endpoint ─────────────────────────────────
  # Requires rabbitmq_prometheus plugin (enabled by default in 3.8+).
  - job_name: rabbitmq
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: skulcredit_rabbitmq
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: skulcredit_rabbitmq

  # ── Loki self-monitoring ───────────────────────────────────────────────────
  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: skulcredit_loki
