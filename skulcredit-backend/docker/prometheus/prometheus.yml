global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: production
    project: skulcredit

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: skulcredit_api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: skulcredit_api
          environment: production
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: skulcredit_api

  - job_name: rabbitmq
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: skulcredit_rabbitmq
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: skulcredit_rabbitmq

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: skulcredit_loki
