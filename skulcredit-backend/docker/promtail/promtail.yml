server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: skulcredit
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]

    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container

      - source_labels: ["__meta_docker_container_label_logging_jobname"]
        target_label: job

      - source_labels: ["__meta_docker_container_image"]
        target_label: image

      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service

    pipeline_stages:
      - json:
          expressions:
            level:      level
            message:    message
            timestamp:  timestamp
            service:    service
            type:       type
            method:     method
            url:        url
            route:      route
            status:     status
            duration_ms: duration_ms
            userId:     userId
            ip:         ip
      - labels:
          level:
          service:
          type:

      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05"
      - match:
          selector: '{job="skulcredit_api"}'
          stages:
            - drop:
                expression: '"level":"debug"'
                drop_counter_reason: debug_log_dropped
  - job_name: skulcredit_file_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: skulcredit_api
          service: skulcredit-api
          source: file
          __path__: /app/logs/*.log

    pipeline_stages:
      - json:
          expressions:
            level:      level
            message:    message
            timestamp:  timestamp
            type:       type
            method:     method
            url:        url
            route:      route
            status:     status
            duration_ms: duration_ms
            userId:     userId
            ip:         ip

      - labels:
          level:
          type:

      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05"
