services:
  api:
    build:
      target: dev
    environment:
      NODE_ENV: development

    volumes:
      - ./skulcredit-backend/src:/app/src
      - ./skulcredit-backend/package.json:/app/package.json
      - ./skulcredit-backend/tsconfig.json:/app/tsconfig.json

  frontend:
    build:
      target: dev
      args:
        VITE_API_BASE_URL: /api/v1
    expose: []
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: /api/v1
      VITE_DEV_API_TARGET: http://api:8080
      VITE_HMR_HOST: localhost
      VITE_HMR_PORT: "5173"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./skulcredit-frontend/src:/app/src
      - ./skulcredit-frontend/public:/app/public
      - ./skulcredit-frontend/index.html:/app/index.html
      - ./skulcredit-frontend/vite.config.ts:/app/vite.config.ts
      - ./skulcredit-frontend/tsconfig.json:/app/tsconfig.json
      - ./skulcredit-frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./skulcredit-frontend/tailwind.config.js:/app/tailwind.config.js
      - ./skulcredit-frontend/postcss.config.js:/app/postcss.config.js
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
